services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-SISFOZIS BAZNAS Cianjur}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_LOCALE: ${APP_LOCALE:-id}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-pkp}
      DB_USERNAME: ${DB_USERNAME:-pkp}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-120}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDER: ${RUN_SEEDER:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - easypanel_storage:/var/www/html/storage

  pkp-queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_NAME: "${APP_NAME:-SISFOZIS BAZNAS Cianjur}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_LOCALE: ${APP_LOCALE:-id}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-pkp}
      DB_USERNAME: ${DB_USERNAME:-pkp}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-120}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      RUN_MIGRATIONS: "false"
      RUN_SEEDER: "false"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - easypanel_storage:/var/www/html/storage

  pkp-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: "${APP_NAME:-SISFOZIS BAZNAS Cianjur}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_LOCALE: ${APP_LOCALE:-id}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-pkp}
      DB_USERNAME: ${DB_USERNAME:-pkp}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-120}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      RUN_MIGRATIONS: "false"
      RUN_SEEDER: "false"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - easypanel_storage:/var/www/html/storage

volumes:
  easypanel_storage:
