worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 25M;
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /var/www/html/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            # Easypanel berada di balik reverse proxy; teruskan skema asli
            fastcgi_param HTTPS $http_x_forwarded_proto_https;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known) { deny all; }
    }

    map $http_x_forwarded_proto $http_x_forwarded_proto_https {
        default "";
        https "on";
    }
}
