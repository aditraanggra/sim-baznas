name: linter

on:
  push:
    branches:
      - master
      - staging
      - production
  pull_request:
    branches:
      - master
      - staging
      - production

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip, intl, bcmath

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Run Pint
        run: php vendor/bin/pint --test

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npm run types
